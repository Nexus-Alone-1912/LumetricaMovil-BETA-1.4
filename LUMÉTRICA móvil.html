<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUMÉTRICA</title>
<style>
:root{--bg:#142D35;--panel:#E7EDE9;--card:#fff;--title:#142D35;--sub:#263F46;--txt:#263F46;--sec:#A5B8B0;--bd:#A5B8B0;--fs:16px;--ff:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--panel:#1B3A43;--card:#263F46;--title:#fff;--sub:#E7EDE9;--txt:#E7EDE9;--bd:#3d5a62}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#1B3A43;--card:#263F46;--title:#fff;--sub:#E7EDE9;--txt:#E7EDE9;--bd:#3d5a62}}
html{font-size:var(--fs);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--ff);min-height:100vh;display:flex;flex-direction:column}
nav{background:#fff;display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;flex-wrap:wrap;position:sticky;top:0;z-index:5}
nav .brand{display:flex;align-items:center;gap:.5rem;font-weight:700;color:#142D35;margin-right:auto}
nav .brand span{background:#142D35;border-radius:.5rem;padding:.2rem;display:flex}nav .brand img{width:1.8rem;height:1.8rem}
nav button{background:none;border:0;color:#263F46;font:inherit;padding:.4rem .7rem;border-radius:.5rem;cursor:pointer}
nav button.on{background:#78D8C0;color:#142D35;font-weight:600}
main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:1rem}
.strip{background:#142D35;display:flex;justify-content:center;padding:2rem 1rem 1rem}
.strip img{width:min(300px,72vw);height:auto;-webkit-mask-image:radial-gradient(closest-side,#000 86%,transparent 100%);mask-image:radial-gradient(closest-side,#000 86%,transparent 100%)}
.panel{background:var(--panel);border-radius:1rem;padding:1.2rem;margin-bottom:1rem}
h1{color:var(--title);margin:.2rem 0 .8rem;font-size:1.6rem}h2{color:var(--sub);font-size:1.15rem;margin:.2rem 0 .8rem}
.hint{color:var(--sec);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:.8rem;padding:.8rem;margin-bottom:.7rem}
label{display:block;font-size:.9rem;margin:.5rem 0 .2rem;color:var(--sub)}
input,select{width:100%;font:inherit;padding:.55rem;border:1px solid var(--bd);border-radius:.5rem;background:var(--card);color:var(--txt)}
input[type=checkbox]{width:1.3rem;height:1.3rem;accent-color:#142D35}
.btn{background:#142D35;color:#fff;border:1px solid #78D8C0;font:inherit;padding:.65rem 1.1rem;border-radius:.6rem;cursor:pointer}
.btn.s{background:#78D8C0;color:#142D35;border-color:#78D8C0;font-weight:600}
.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.home{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;max-width:420px;margin:1.2rem auto}
.home .btn{padding:1rem;font-size:1.1rem}
.chip{background:#142D35;color:#78D8C0;border-radius:.5rem;padding:.2rem .45rem;margin-right:.4rem}
.fx{display:flex;align-items:center;gap:.5rem;font-weight:600;color:var(--sub)}
.fxd{display:none;margin-top:.5rem}.fxd.on{display:block}
.line{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.tot{font-size:1.4rem;font-weight:700;color:var(--title)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.8rem}
.h{background:var(--card);border:1px solid var(--bd);border-radius:.8rem;padding:.6rem;text-align:center}
.h img{width:100%;border-radius:.4rem;background:#fff}.h b{display:block;margin-top:.4rem;color:var(--title)}.h small{color:var(--sec);font-size:.75rem}
footer{background:#142D35;color:#A5B8B0;text-align:center;padding:1rem;font-size:.85rem}
.cdisp{background:#142D35;border-radius:.7rem;padding:.8rem 1rem;text-align:right;margin-bottom:.7rem;min-height:5rem;overflow:hidden}.cex{color:#A5B8B0;font-size:1rem;min-height:1.3rem;word-break:break-all}.clive{color:#fff;font-size:1.9rem;font-weight:700;word-break:break-all}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.8rem}.key{padding:.9rem 0;font:inherit;font-size:1.25rem;border-radius:.6rem;border:1px solid var(--bd);background:var(--card);color:var(--txt);cursor:pointer}.key.k2{grid-column:span 2}.key.op{background:#78D8C0;color:#142D35;font-weight:700}.key.eq{background:#142D35;color:#fff;font-weight:700}.key:active{opacity:.7}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.stat{background:var(--card);border:1px solid var(--bd);border-radius:.7rem;padding:.6rem}.stat small{color:var(--sec)}.stat b{display:block;font-size:1.05rem;color:var(--title)}
.sem{display:flex;gap:.6rem;align-items:center;padding:.6rem;border-radius:.7rem;margin:.6rem 0;color:#263F46}.sem .dot{width:1rem;height:1rem;border-radius:50%;flex:none}.sem.g{background:#e3f6ee}.sem.g .dot{background:#2e9e6b}.sem.y{background:#fff4d6}.sem.y .dot{background:#e0a800}.sem.r{background:#fde4e4}.sem.r .dot{background:#d64545}.sem.n{background:#eceeed}.sem.n .dot{background:#A5B8B0}
.hs{margin:1rem auto 0;max-width:420px}.hv{font-size:2rem;font-weight:700;color:var(--title)}.hl{color:var(--sec);font-size:.85rem}
.badge{font-size:.72rem;padding:.1rem .45rem;border-radius:1rem;background:#E7EDE9;color:#263F46}.badge.r{background:#fde4e4;color:#a02323}.badge.g{background:#e3f6ee;color:#1d7a50}.warn{color:#c0392b;font-size:.9rem}
.v{display:none}.v.on{display:block}
#inv{background:#fff;border-radius:.6rem;overflow:auto}#inv img{width:100%;min-width:420px}

html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}
body{padding-bottom:4.8rem}
main{max-width:520px;padding:.75rem}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;padding:.3rem .1rem calc(.3rem + env(safe-area-inset-bottom,0px));gap:0;flex-wrap:nowrap;box-shadow:0 -2px 12px rgba(0,0,0,.25)}
nav .brand{display:none}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.56rem;padding:.4rem 0;min-height:3.2rem;white-space:nowrap;letter-spacing:-.02em}
nav button i{font-style:normal;font-size:1.2rem;line-height:1}
.panel{padding:1rem;border-radius:1.1rem}
h1{font-size:1.4rem}
input,select{font-size:max(16px,1rem);padding:.75rem}
input[type=checkbox]{padding:0}
.btn{padding:.85rem 1rem;min-height:2.9rem}
.row>*{min-width:0;flex:1 1 45%}
.home{max-width:none;width:100%;margin:1rem 0;gap:.7rem}.home .btn{padding:1.05rem .5rem;font-size:1.05rem;border-radius:1rem}
.strip{padding:2rem 0 .5rem}.strip img{width:min(280px,76vw)}
.key{padding:1.05rem 0;font-size:1.4rem}.keys{gap:.55rem}.clive{font-size:2.1rem}
.grid{grid-template-columns:repeat(2,1fr);gap:.6rem}
#inv img{min-width:0}
footer{padding:.8rem;font-size:.75rem}
</style></head><body>

const _n=new Date();let today=`${_n.getFullYear()}-${String(_n.getMonth()+1).padStart(2,"0")}-${String(_n.getDate()).padStart(2,"0")}`;

function view(v){document.querySelectorAll(".v").forEach(e=>e.classList.toggle("on",e.id===v));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));

function drawApp(){

 <div class="card"><h2>Historial de movimientos</h2><div class="row">${sel("acc",`<option value="">Todas las cuentas</option>`+ACC.map(a=>`<option value="${a.id}" ${a.id===AF.acc?"selected":""}>${esc(a.name)}</option>`).join(""))}${sel("type",`<option value="">Ingresos y gastos</option><option value="ing" ${AF.type==="ing"?"selected":""}>Ingresos</option><option value="gas" ${AF.type==="gas"?"selected":""}>Gastos</option>`)}${sel("cat",`<option value="">Todas las categorías</option>`+[...new Set(MOV.map(m=>m.cat))].map(c=>`<option ${c===AF.cat?"selected":""}>${esc(c)}</option>`).join(""))}</div><label>Mes (vacío = todos)</label><input type="month" value="${MM}" onchange="MM=this.value;drawMoney()"><p class="hint">Ingresos ${CRC(mi)} · Gastos ${CRC(mg)}</p>${ms.length?ms.map(mr).join(""):'<p class="hint">Sin movimientos con estos filtros.</p>'}</div></div>`}
function payO(id){const o=OBL.find(x=>x.id===id),ref=id+":"+o.due,ac=PACC||(ACC.find(a=>a.active)||{}).id;if(!ac){CM="Primero crea una cuenta en Mi dinero.";drawCal();return}if(MOV.some(m=>m.ref===ref&&!m.void)){CM="Ese pago ya estaba registrado.";drawCal();return}if(bal(ac)<o.amount&&PW!==id){PW=id;CM="Saldo insuficiente en la cuenta elegida. Pulsa «Marcar pagado» otra vez para confirmar.";drawCal();return}PW=null;MOV.push({id:uid(),date:today,time:nowT(),type:"gas",desc:o.name,amount:o.amount,cat:"GASTO FIJO",ref,acc:ac,origin:"calendario"});if(o.freq==="unica")o.paid=true;else o.due=addFreq(o.due,o.freq,o.day);sv("cr_mov",MOV);sv("cr_obl",OBL);CM="Pago registrado como gasto.";drawCal()}
function editO(id){OE=id;CM="";drawCal();scrollTo(0,0)}
function delO(id){if(DEL!==id){DEL=id;drawCal();return}OBL=OBL.filter(o=>o.id!==id);DEL=null;sv("cr_obl",OBL);drawCal()}
function saveO(){const g=i=>$(i).value.trim(),n=g("#on"),a=num(g("#oa")),d=g("#od");if(!n||!(a>0)||!okD(d)){CM="Revisa el nombre, el monto (mayor a 0) y la fecha de vencimiento.";drawCal();return}
 const o={name:n,cat:g("#oc"),amount:a,due:d,freq:g("#of"),company:g("#oe"),day:+d.slice(8)};addEmp(o.company);
 if(OBL.some(x=>x.id!==OE&&x.name.toLowerCase()===n.toLowerCase()&&x.due===d&&x.amount===a)){CM="Esa obligación ya existe.";drawCal();return}
 if(OE){const x=OBL.find(y=>y.id===OE);if(x.due!==d)x.paid=false;Object.assign(x,o)}else OBL.push(Object.assign({id:uid(),paid:false},o));sv("cr_obl",OBL);OE=null;CM="Obligación guardada.";drawCal()}
function drawCal(){const e=OBL.find(o=>o.id===OE)||{name:"",cat:"Electricidad",amount:"",due:today,freq:"mensual",company:""},act=pays(),pd=OBL.filter(o=>o.paid);
 const row=o=>{const late=!o.paid&&o.due<today;return `<div class="card"><div class="line"><div><b>${esc(o.name)}</b> <span class="badge ${o.paid?"g":late?"r":""}">${o.paid?"Pagado":late?"Vencido":"Pendiente"}</span><br><span class="hint">${esc(o.cat)}${o.company?" · "+esc(o.company):""} · ${FRQ[o.freq]}</span></div><b>${CRC(o.amount)}</b></div><div class="line" style="margin-top:.4rem"><span class="hint">${o.due}${o.paid?"":" · "+cd(o.due)}</span><span>${o.paid?"":`<button class="btn s" style="padding:.3rem .6rem" onclick="payO('${o.id}')">Marcar pagado</button> `}<button class="btn" style="padding:.3rem .6rem" onclick="editO('${o.id}')">Editar</button> <button class="btn" style="padding:.3rem .6rem" onclick="delO('${o.id}')">${DEL===o.id?"¿Seguro?":"Eliminar"}</button></span></div></div>`};
 $("#cal").innerHTML=`<div class="panel"><h1>Calendario financiero</h1>${empList()}<div class="card"><h2>${OE?"Editar obligación":"Nueva obligación"}</h2><label>Nombre</label><input id="on" value="${esc(e.name)}" placeholder="Ej: Recibo de luz"><div class="row"><div><label>Categoría</label><select id="oc">${OC.map(c=>`<option ${c===e.cat?"selected":""}>${c}</option>`).join("")}</select></div><div><label>Monto (₡)</label><input id="oa" type="number" min="0" step="0.01" value="${e.amount}"></div></div><div class="row"><div><label>Próximo vencimiento</label><input id="od" type="date" value="${e.due}"></div><div><label>Frecuencia</label><select id="of">${Object.keys(FRQ).map(k=>`<option value="${k}" ${k===e.freq?"selected":""}>${FRQ[k]}</option>`).join("")}</select></div></div><label>Empresa (opcional)</label><input id="oe" list="emps" value="${esc(e.company)}">${CM?`<p class="hint">${CM}</p>`:""}<div class="row" style="margin-top:.7rem"><button class="btn s" onclick="saveO()">Guardar obligación</button>${OE?'<button class="btn" onclick="OE=null;drawCal()">Cancelar</button>':""}</div></div><h2>Próximos pagos</h2><label>Pagar con la cuenta</label><select onchange="PACC=this.value">${accOpts(PACC||(ACC.find(a=>a.active)||{}).id)}</select>${act.length?act.map(row).join(""):'<p class="hint">Aún no hay obligaciones pendientes.</p>'}${pd.length?`<h2>Pagadas</h2>${pd.map(row).join("")}`:""}</div>`}
applyCfg();view("home");
</script></body></html>
